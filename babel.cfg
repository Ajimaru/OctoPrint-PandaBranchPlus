[python: */**.py]

# No octoprint.util.jinja.trycatch extension here: the templates don't use
# {% try %}, and requiring it makes extraction need a full OctoPrint install
# (a failed extract truncates the POT before crashing).
[jinja2: */**.jinja2]
silent=false
extensions=jinja2.ext.do

[javascript: */**.js]
extract_messages = gettext, ngettext
